<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prayer Fire Movement — Feature Graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,600&family=Nunito+Sans:ital,wght@0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: #0a1628;
  }
  .banner {
    position: relative;
    width: 1024px;
    height: 500px;
    background: #0a1628;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  /* Subtle warm vignette behind the flame for depth, without breaking the flat navy brand background. */
  .glow {
    position: absolute;
    left: -60px;
    top: 50%;
    transform: translateY(-50%);
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,106,0,0.28) 0%, rgba(255,106,0,0.10) 45%, rgba(255,106,0,0) 72%);
    filter: blur(2px);
  }
  .logo {
    position: relative;
    z-index: 2;
    flex: 0 0 auto;
    width: 300px;
    height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo img {
    width: 240px;
    height: auto;
    filter: drop-shadow(0 0 42px rgba(255,106,0,0.45));
  }
  .text {
    position: relative;
    z-index: 2;
    flex: 1 1 auto;
    padding-right: 56px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .title {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 68px;
    line-height: 1.04;
    color: #f1f5f9;
    letter-spacing: -0.5px;
  }
  .tagline {
    font-family: 'Nunito Sans', sans-serif;
    font-style: italic;
    font-weight: 600;
    font-size: 27px;
    line-height: 1.4;
    color: #ff8a3d;
    margin-top: 18px;
    letter-spacing: 0.1px;
  }
  .rule {
    width: 84px;
    height: 5px;
    border-radius: 3px;
    background: linear-gradient(90deg, #ff6a00, #ff3d00);
    margin-top: 22px;
  }
</style>
</head>
