<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Prayer Fire</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at 50% 0%, #24345a 0%, #14213d 55%, #0e1628 100%);
        color: #f3eee4; text-align: center; padding: 32px;
      }
      .flame {
        width: 74px; height: 74px; margin: 0 auto 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 65%, #6ee7b7 0%, #34d399 45%, #047857 75%, rgba(4,120,87,0) 100%);
        box-shadow: 0 0 42px rgba(52,211,153,.45);
        animation: flicker 1.6s ease-in-out infinite;
      }
      @keyframes flicker {
        0%,100% { transform: scale(1); opacity: 1; }
        50%     { transform: scale(1.07); opacity: .88; }
      }
      h1 { font-size: 21px; margin: 0 0 8px; letter-spacing: .4px; }
      p { margin: 0; font-size: 14px; line-height: 1.6; color: #f3eee4; }
      .hint { margin-top: 26px; font-size: 12px; color: #a9a79f; }
    </style>
  </head>
  <body>
    <main>
      <div class="flame"></div>
      <h1>Prayer Fire</h1>
      <p>Pray 3x a day — a cure for prayerlessness.<br />Connecting to the prayer fire…</p>
      <p class="hint">This screen only appears when the app cannot reach the network.</p>
    </main>
    <script>
      // The native shell normally loads https://prayer-fire.vercel.app directly
      // (see capacitor.config.ts → server.url). This page is the offline fallback
      // that ships inside the APK, so the WebView always has something to show.
      var target = 'https://prayer-fire.vercel.app';
      try {
        var Capacitor = window.Capacitor;
        if (Capacitor && Capacitor.isNativePlatform && !Capacitor.isNativePlatform()) {
          window.location.replace(target);
        }
      } catch (e) { /* stay on the branded fallback */ }
    </script>
  </body>
</html>
