name: Android Release Build

# Builds the signed Play Store bundle from GitHub — no Android Studio needed.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   1. ANDROID_KEYSTORE_BASE64
#        base64 -w0 android/keystore/prayer-fire-upload.keystore | pbcopy
#      (use `| clip` on Windows, `| xclip -selection clipboard` on Linux)
#   2. ANDROID_KEYSTORE_PROPERTIES
#        cat android/keystore.properties | pbcopy
#      (the whole file, including the passwords)

on:
  workflow_dispatch:
    inputs:
      build_debug_apk:
        description: 'Also build a debug APK'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  android:
    name: Signed AAB + APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare Capacitor webDir
        run: bash scripts/prepare-android-webdir.sh

      - name: Sync native project
        run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          mkdir -p android/keystore
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/prayer-fire-upload.keystore
            printf '%s\n' "$KEYSTORE_PROPERTIES" > android/keystore.properties
            chmod 600 android/keystore.properties android/keystore/prayer-fire-upload.keystore
            echo "Signing key restored — the bundle will be signed."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PROPERTIES are not set, so the AAB will be UNSIGNED and Play Console will reject it. See the header of this file."
          fi

      - name: Build release AAB + universal APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --no-daemon
          ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_debug_apk }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify signature
        working-directory: android
        run: |
          set +e
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort | tail -1)"
          if [ -n "$APKSIGNER" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -12
            echo "APK signature OK."
          else
            echo "apksigner unavailable — skipping signature verification."
          fi

      - name: Upload release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: prayer-fire-android-${{ github.ref_name || github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/output-metadata.json
            android/app/build/outputs/apk/debug/app-debug.apk
